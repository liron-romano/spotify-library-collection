<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collection — Your Spotify Albums</title>
<link rel="stylesheet" href="css/styles.css">
<script>
  // Apply theme before first paint to avoid a flash of the wrong theme.
  // Kept inline (not a module) because it must run synchronously before the
  // page paints — an external/deferred script would be too late.
  (function(){
    var saved = localStorage.getItem('theme');
    var theme = (saved === 'dark' || saved === 'light')
      ? saved
      : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
</head>
<body>

<div id="app"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
